name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-windows.yml]

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows app and installer
        run: pnpm desktop:installer
      - name: Verify release files and write checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dist = 'node_modules/.checkcc-dist'
          $files = @("$dist/EnvGuardCC-Setup-$version.exe", "$dist/EnvGuardCC-Windows-x64.zip")
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release file: $file" }
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))" | Add-Content "$dist/SHA256SUMS.txt"
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $dist = 'node_modules/.checkcc-dist'
          $notes = Join-Path $env:RUNNER_TEMP 'envguardcc-release-notes.md'
          @"
          EnvGuardCC Windows x64

          - EnvGuardCC-Setup-$version.exe: Windows 安装包，下载后运行安装。
          - EnvGuardCC-Windows-x64.zip: 便携版，完整解压后运行 EnvGuardCC.exe。
          - SHA256SUMS.txt: 安装包与便携包的 SHA-256 校验值。

          安装包未进行代码签名。
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "EnvGuardCC $version" --notes-file $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "$dist/EnvGuardCC-Setup-$version.exe" "$dist/EnvGuardCC-Windows-x64.zip" "$dist/SHA256SUMS.txt" --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
