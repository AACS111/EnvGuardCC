name: Mobile build (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform (all, android, ios)
        required: false
        default: all
        type: choice
        options: [all, android, ios]
  push:
    tags: ['v*']
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - 'src-tauri/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/check-mobile.mjs'
      - '.github/workflows/release-mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: mobile/core/go.mod
      - name: Run Go mobile core unit tests
        working-directory: mobile/core
        run: |
          go mod tidy
          go test -v ./...

  android:
    needs: go-core-test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK & build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize & build Android APK
        run: |
          (cd mobile/core && go get -tool golang.org/x/mobile/cmd/gobind && go mod tidy)
          pnpm mobile:init:android
          pnpm mobile:build:android
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: envguardcc-android-apk
          retention-days: 14
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    needs: go-core-test
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Go iOS XCFramework & initialize Tauri iOS project
        run: |
          (cd mobile/core && go get -tool golang.org/x/mobile/cmd/gobind && go mod tidy)
          pnpm mobile:core:ios
          pnpm mobile:init:ios
      - name: Upload iOS XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: envguardcc-ios-xcframework
          retention-days: 14
          path: node_modules/.checkcc-mobile-core/EnvGuardCore.xcframework
