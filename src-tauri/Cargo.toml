[package]
name = "envguardcc"
version = "0.2.7"
description = "EnvGuardCC cross-platform host (desktop and mobile)"
edition = "2021"
license = "MIT"

[lib]
name = "envguardcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "dynamic-acl"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
trash = "5"
open = "5"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
